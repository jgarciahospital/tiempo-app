<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cg%3E%3Ccircle cx='25' cy='24' r='11' fill='%23fbbf24'/%3E%3Cpath d='M19 47h27a9 9 0 0 0 .7-17.95 13 13 0 0 0-24.3-3.1A8.6 8.6 0 0 0 19 47z' fill='%23dbe4f0'/%3E%3Cg stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'%3E%3Cline x1='24' y1='52' x2='22' y2='58'/%3E%3Cline x1='33' y1='52' x2='31' y2='58'/%3E%3Cline x1='42' y1='52' x2='40' y2='58'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ccircle cx='25' cy='24' r='11' fill='%23fbbf24'/%3E%3Cpath d='M19 47h27a9 9 0 0 0 .7-17.95 13 13 0 0 0-24.3-3.1A8.6 8.6 0 0 0 19 47z' fill='%23dbe4f0'/%3E%3C/svg%3E" />
<title>Weather · forecast, rain and radar</title>
<meta name="description" content="5, 10 and 15-day forecast with morning and afternoon, chance of rain, ±12 h precipitation chart and weather radar zoomed to your location." />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1a2e; --card:#111c33; --card2:#16233f;
    --ink:#eaf1ff; --muted:#93a4c4; --line:#22314f;
    --accent:#4f9dff; --accent2:#7cc4ff; --rain:#38bdf8; --rainpast:#5a708f; --prob:#a78bfa;
    --warn:#fbbf24; --ok:#34d399; --danger:#fb7185;
    --radius:18px; --shadow:0 10px 30px rgba(0,0,0,.35);
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef3fb; --bg2:#e3ecf9; --card:#ffffff; --card2:#f4f8ff;
      --ink:#0d1730; --muted:#5a6a86; --line:#dbe6f7; --rainpast:#9fb0c8;
      --shadow:0 10px 30px rgba(20,40,80,.10);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); color:var(--ink);
    background:radial-gradient(1200px 600px at 70% -10%, var(--bg2), var(--bg)) no-repeat;
    background-attachment:scroll; min-height:100vh; -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  .wrap{max-width:960px;margin:0 auto;padding:16px 16px 48px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px 18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .loc{display:flex;align-items:center;gap:8px;min-width:0}
  .loc .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  button, .btn{
    font-family:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line);
    background:var(--card);color:var(--ink);padding:8px 12px;border-radius:12px;transition:.15s ease;line-height:1;
  }
  button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
  button:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:#04122b;border-color:transparent;font-weight:600}
  .btn.primary:hover{filter:brightness(1.06);color:#04122b}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 4px 8px;flex-wrap:wrap}
  .section-title h2{font-size:1.02rem;margin:0;letter-spacing:.2px}

  /* Current conditions */
  .hero{padding:14px;display:flex;flex-direction:column;gap:11px}
  .hero-main{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:stretch}
  .hero .now{display:flex;align-items:center;gap:13px;padding:2px}
  .hero .now .ico{width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:none}
  .wi{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}
  .hero .now .temp{font-size:2.6rem;font-weight:700;line-height:1}
  .hero .now .desc{color:var(--muted);margin-top:1px;font-size:.9rem}
  .hero .now .minmax{margin-top:5px;display:flex;gap:14px;font-size:.98rem}
  .hero .now .minmax .mx{color:var(--warn)}
  .hero .now .minmax .mn{color:var(--accent2)}
  .hero .now .minmax b{font-weight:700}
  .hero .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .metric{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
  .metric .k{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}
  .metric .v{font-size:1.02rem;font-weight:600;margin-top:1px}
  @media (max-width:720px){ .hero-main{grid-template-columns:1fr} }

  /* Day carousel */
  .carousel-wrap{position:relative}
  .days-carousel{
    display:flex;gap:10px;overflow-x:auto;padding:12px;scroll-snap-type:x proximity;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;align-items:stretch;
  }
  .days-carousel::-webkit-scrollbar{height:8px}
  .days-carousel::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .days-carousel{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .day-card{
    flex:0 0 auto;width:178px;scroll-snap-align:start;background:var(--card2);
    border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;
    cursor:pointer;transition:border-color .15s, transform .1s;
  }
  .day-card:hover{border-color:var(--accent)}
  .day-card:active{transform:scale(.99)}
  .day-card.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .dc-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .dc-name{font-weight:700;text-transform:capitalize}
  .dc-date{color:var(--muted);font-size:.76rem}
  .seg{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px;
       background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .seg .seg-when{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .seg .seg-ico{display:flex;justify-content:center;width:30px}
  .seg .seg-temp{font-weight:700;font-size:1rem;text-align:right;white-space:nowrap;min-width:34px}
  .seg .seg-prob{grid-column:1 / -1;font-size:.76rem;color:var(--rain);display:flex;align-items:center;gap:5px}
  .dc-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;padding:0 2px;margin-top:auto}
  .dc-foot b{color:var(--ink)}
  .fade-right{position:absolute;top:1px;bottom:1px;right:1px;width:56px;pointer-events:none;
    background:linear-gradient(270deg,var(--card) 30%,transparent);
    border-top-right-radius:var(--radius);border-bottom-right-radius:var(--radius);
    display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
    color:var(--muted);font-size:1.6rem;font-weight:300;opacity:0;transition:opacity .2s}
  .fade-right.show{opacity:1}

  /* Chance of rain (inside hero) */
  .rain-now{display:flex;align-items:center;gap:12px;background:var(--card2);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .gauge{position:relative;width:68px;height:68px;flex:none}
  .gauge svg{transform:rotate(-90deg);width:100%;height:100%}
  .gauge .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
  .rain-now .txt{min-width:0}
  .rain-now .txt .k{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px}
  .rain-now .txt .big{font-size:.95rem;font-weight:600;line-height:1.2}
  .rain-now .txt .sub{color:var(--muted);margin-top:2px;font-size:.8rem;line-height:1.25}
  .rain-now .txt .rn-hint{color:var(--muted);font-size:.74rem;margin-top:4px}

  /* Hourly tabs */
  .hourly{padding:0}
  .hourly-tabs{display:flex;gap:22px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
  .hourly-tabs button{background:none;border:none;border-radius:0;padding:0 0 9px;color:var(--muted);
    font-size:.9rem;font-weight:600;border-bottom:2px solid transparent;position:relative;top:1px}
  .hourly-tabs button:hover{color:var(--ink);border-color:transparent}
  .hourly-tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}
  .hourly-panel{display:none}
  .hourly-panel.active{display:block}

  /* Hourly charts */
  .chart-card{padding:8px 0 4px;position:relative}
  .chart-legend{display:flex;gap:14px;padding:0 14px 6px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
  .chart-legend .lg{display:flex;align-items:center;gap:6px}
  .swatch{width:12px;height:12px;border-radius:3px}
  .chart-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;position:relative}
  .chart-scroll::-webkit-scrollbar{height:8px}
  .chart-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .chart-scroll canvas{display:block;height:196px}
  .yaxis{position:absolute;top:8px;height:196px;width:38px;pointer-events:none;z-index:3}
  .yaxis.left{left:0;background:linear-gradient(90deg,var(--card) 70%,transparent)}
  .yaxis.right{right:0;background:linear-gradient(270deg,var(--card) 70%,transparent);text-align:right}
  .yaxis span{position:absolute;font-size:10px;color:var(--muted);left:4px;right:4px}
  .chart-empty{padding:26px;text-align:center;color:var(--muted)}

  /* Model agreement (compact) */
  .consensus{padding:10px 12px;opacity:.9}
  .cs-hdr{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:7px}
  .cs-head{display:flex;align-items:center;gap:10px}
  .cs-badge{flex:none;text-align:center;padding:3px 8px;border-radius:999px;font-weight:700;
    font-size:.62rem;text-transform:uppercase;letter-spacing:.3px;border:1px solid var(--line);background:var(--card2)}
  .cs-badge .lvl{display:inline;font-size:.62rem;margin-left:3px}
  .cs-badge.high{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .cs-badge.medium{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .cs-badge.low{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
  .cs-title{font-size:.84rem;font-weight:600;line-height:1.25}
  .cs-sub{color:var(--muted);font-size:.76rem;margin-top:1px;line-height:1.3}
  .cs-models{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .cs-m{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);
    border-radius:999px;padding:3px 8px;font-size:.72rem}
  .cs-m .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .cs-m .dot.rain{background:var(--rain)} .cs-m .dot.dry{background:var(--muted)} .cs-m .dot.na{background:var(--line)}
  .cs-m .nm{font-weight:600} .cs-m .vals{color:var(--muted)}

  /* Radar */
  #radar{height:440px;border-radius:var(--radius);overflow:hidden;position:relative}
  .radar-controls{
    position:absolute;z-index:500;left:12px;bottom:12px;display:flex;align-items:center;gap:10px;
    background:rgba(10,18,34,.72);backdrop-filter:blur(8px);padding:8px 10px;border-radius:12px;color:#eaf1ff;
    font-size:.82rem;border:1px solid rgba(255,255,255,.08)
  }
  .radar-controls button{background:rgba(255,255,255,.1);border-color:transparent;color:#fff;padding:6px 9px}
  .radar-scale{
    position:absolute;z-index:500;right:12px;top:12px;background:rgba(10,18,34,.72);backdrop-filter:blur(8px);
    padding:8px 10px;border-radius:10px;color:#dfeaff;font-size:.72rem;border:1px solid rgba(255,255,255,.08)
  }
  .radar-scale .bar{height:8px;width:150px;border-radius:4px;margin-top:6px;
    background:linear-gradient(90deg,#22c1ee,#3b82f6,#22c55e,#eab308,#f97316,#ef4444,#a21caf)}
  .radar-scale .ends{display:flex;justify-content:space-between;margin-top:3px;color:#9fb3d6}
  .leaflet-control-layers{border-radius:10px !important}

  /* Location overlay */
  .overlay{position:fixed;inset:0;z-index:2000;background:rgba(4,9,20,.72);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .overlay.hidden{display:none}
  .modal{width:100%;max-width:440px;padding:24px;border-radius:20px}
  .modal h3{margin:0 0 6px;font-size:1.2rem}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:.92rem;line-height:1.5}
  .modal .field{display:flex;gap:8px;margin-top:10px}
  .modal input[type=text]{flex:1;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);color:var(--ink);font-size:.95rem;font-family:inherit}
  .modal input[type=text]:focus{outline:none;border-color:var(--accent)}
  .results{margin-top:10px;display:grid;gap:6px;max-height:220px;overflow:auto}
  .result{padding:10px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-size:.9rem}
  .result:hover{border-color:var(--accent)}
  .result .r-sub{color:var(--muted);font-size:.8rem}
  .modal .status{margin-top:12px;font-size:.85rem;color:var(--muted);min-height:18px}
  .modal .status.err{color:var(--danger)}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;margin:16px 0 4px}
  .divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Day detail popup */
  .daymodal{width:100%;max-width:500px;max-height:82vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
  .dm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  .dm-summary{display:flex;align-items:center;gap:12px;min-width:0}
  .dm-summary .dm-ico{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
  .dm-summary h3{margin:0;font-size:1.15rem;text-transform:capitalize}
  .dm-sub{color:var(--muted);font-size:.86rem;margin-top:2px}
  .dm-actions{display:flex;align-items:center;gap:6px;flex:none}
  .dm-nav{width:34px;height:36px;border-radius:10px;padding:0;font-size:1.35rem;line-height:1;color:var(--ink)}
  .dm-nav:disabled{opacity:.3;cursor:default}
  .dm-nav:disabled:hover{border-color:var(--line);color:var(--ink)}
  .dm-x{flex:none;border-radius:50%;width:36px;height:36px;padding:0;font-size:1rem;line-height:1}
  @keyframes dmSlideL{from{opacity:.2;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
  @keyframes dmSlideR{from{opacity:.2;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
  .dm-cols{display:grid;grid-template-columns:56px 34px 1fr 62px 66px;gap:10px;padding:8px 18px;
    color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
  .dm-cols span:nth-child(3){text-align:left}
  .dm-cols span:nth-child(4),.dm-cols span:nth-child(5){text-align:right}
  .dm-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 14px}
  .dm-row{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}
  .dm-row:last-child{border-bottom:none}
  .dm-main{display:grid;grid-template-columns:56px 34px 1fr 62px 66px;gap:10px;align-items:center}
  .dm-meta{display:flex;flex-wrap:wrap;gap:14px;padding-left:66px;color:var(--muted);font-size:.78rem}
  .dm-meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dm-meta .mi{flex:none;display:block}
  .dm-row.now{background:linear-gradient(90deg,rgba(79,157,255,.14),transparent);border-radius:10px;padding-left:6px;margin-left:-6px}
  .dm-row.now .dm-meta{padding-left:60px}
  .dm-time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
  .dm-ico2{display:flex;justify-content:center}
  .dm-temp{font-weight:700}
  .dm-prob{text-align:right;font-size:.86rem;color:var(--prob)}
  .dm-prob.zero{color:var(--muted);opacity:.5}
  .dm-mm{text-align:right;font-size:.86rem;color:var(--rain)}
  .dm-mm.zero{color:var(--muted);opacity:.5}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:3000;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    padding:10px 16px;border-radius:12px;font-size:.88rem;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  footer{margin-top:36px;text-align:center;color:var(--muted);font-size:.78rem;line-height:1.6}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span> <span id="brandName">Weather</span></div>
    <div class="loc">
      <span class="name" id="locName"></span>
      <button id="btnChange"></button>
    </div>
  </header>

  <!-- Current conditions with integrated chance of rain -->
  <section class="card hero" id="hero" aria-live="polite">
    <div class="hero-main">
      <div class="now">
        <div class="ico" id="nowIco">⏳</div>
        <div>
          <div class="temp" id="nowTemp">--°</div>
          <div class="desc" id="nowDesc"></div>
          <div class="minmax" id="nowMinMax"></div>
        </div>
      </div>
      <div class="rain-now" id="rainNow">
        <div class="gauge">
          <svg width="88" height="88" viewBox="0 0 96 96">
            <circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="10"/>
            <circle id="gaugeArc" cx="48" cy="48" r="40" fill="none" stroke="var(--rain)" stroke-width="10"
                    stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
          </svg>
          <div class="val" id="gaugeVal">--%</div>
        </div>
        <div class="txt">
          <div class="k" id="rainLabel"></div>
          <div class="big" id="rainBig"></div>
          <div class="sub" id="rainSub"></div>
          <div class="rn-hint" id="rainHint"></div>
        </div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="k" id="mFeelsK"></div><div class="v" id="mFeels">--°</div></div>
      <div class="metric"><div class="k" id="mWindK"></div><div class="v" id="mWind">-- km/h</div></div>
      <div class="metric"><div class="k" id="mHumK"></div><div class="v" id="mHum">--%</div></div>
    </div>
  </section>

  <!-- Hourly: Temperature (+humidity) / Precipitation / Wind -->
  <div class="section-title"><h2 id="titleHourly"></h2></div>
  <section class="card hourly">
    <div class="hourly-tabs" id="hourlyTabs">
      <button data-tab="temp" class="active" id="tabTemp"></button>
      <button data-tab="precip" id="tabPrecip"></button>
      <button data-tab="wind" id="tabWind"></button>
    </div>

    <div class="hourly-panel chart-card active" id="panelTemp">
      <div class="chart-legend" id="legendTemp"></div>
      <div class="yaxis left" id="yLeftTemp"></div>
      <div class="yaxis right" id="yRightTemp"></div>
      <div class="chart-scroll" id="scrollTemp"><canvas id="chartTemp"></canvas></div>
    </div>

    <div class="hourly-panel chart-card" id="panelPrecip">
      <div class="chart-legend" id="legendPrecip"></div>
      <div class="yaxis left" id="yLeft"></div>
      <div class="yaxis right" id="yRight"></div>
      <div class="chart-scroll" id="chartScroll"><canvas id="precipChart"></canvas></div>
      <div class="chart-empty" id="chartEmpty" style="display:none"></div>
    </div>

    <div class="hourly-panel chart-card" id="panelWind">
      <div class="chart-legend" id="legendWind"></div>
      <div class="yaxis left" id="yLeftWind"></div>
      <div class="chart-scroll" id="scrollWind"><canvas id="chartWind"></canvas></div>
    </div>
  </section>

  <div class="section-title"><h2 id="titleExtended"></h2></div>
  <section class="card carousel-wrap">

  if(code===0) return isDay?"sun":"moon";
  if(code===1||code===2) return isDay?"partly":"partlyNight";
  if(code===3) return "cloud";
  if(code===45||code===48) return "fog";
  if((code>=51&&code<=67)||code===80||code===81||code===82) return "rain";
  if((code>=71&&code<=77)||code===85||code===86) return "snow";
  if(code>=95) return "storm";
  return "cloud";
}

  if(code>=95)return 9; if(code>=80)return 8; if(code>=61)return 7; if(code>=71)return 6;
  if(code>=51)return 5; if(code>=45)return 4; if(code===3)return 3; if(code===2)return 2; if(code===1)return 1; return 0;
}

function requestPreciseLocation(){
  if(!("geolocation" in navigator)){ showOverlay(t("geo_unsupported"), true); return; }
  $("ovStatus").classList.remove("err");
  $("ovStatus").innerHTML = '<span class="spinner"></span> '+t("requesting");

    async (pos)=>{
      const { latitude, longitude } = pos.coords;
      const name = await reverseGeocode(latitude, longitude);
      setLocation(latitude, longitude, name || t("my_location")); hideOverlay();
    },
    (err)=>{
      let m = t("geo_fail");
      if(err.code===1) m = t("geo_denied");
      else if(err.code===2) m = t("geo_unavailable");
      else if(err.code===3) m = t("geo_timeout");
      showOverlay(m, true); $("searchInput").focus();
    },
    { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
  );
}
async function doSearch(){
  const q = $("searchInput").value.trim();

  const s=$("ovStatus"); s.classList.remove("err"); s.innerHTML='<span class="spinner"></span> '+t("searching"); $("results").innerHTML="";
  try{
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${GEO_LANG}&format=json`;
    const r = await fetch(url); const data = await r.json(); s.textContent="";

/* ===================== Model agreement (precipitation-focused) ===================== */
const MODELS=[
  {id:"ecmwf_ifs025", name:"ECMWF"},
  {id:"gfs_seamless", name:"GFS"},
  {id:"icon_seamless", name:"ICON"},
  {id:"gem_seamless", name:"GEM"},
  {id:"meteofrance_seamless", name:"Météo-France"}
];
function hideConsensus(){ $("consensus").style.display="none"; }
function showConsensus(){ $("consensus").style.display=""; }

async function loadConsensus(lat,lon){
  const ids=MODELS.map(m=>m.id).join(",");
  const url="https://api.open-meteo.com/v1/forecast"
    +`?latitude=${lat}&longitude=${lon}`
    +"&daily=precipitation_sum,precipitation_probability_max&forecast_days=1&timezone=auto"
    +`&models=${ids}`;
  try{
    const r=await fetch(url); const d=await r.json(); if(d.error) throw 0;
    const dl=d.daily||{};
    const rows=MODELS.map(m=>{
      const sum=(dl["precipitation_sum_"+m.id]||[null])[0];
      const prob=(dl["precipitation_probability_max_"+m.id]||[null])[0];
      return {name:m.name, sum:(sum==null?null:sum), prob:(prob==null?null:prob), usable: prob!=null};
    });
    renderConsensus(rows);
  }catch(e){ hideConsensus(); }
}
function renderConsensus(rows){
  const usable=rows.filter(r=>r.usable);
  if(usable.length<2){ hideConsensus(); return; }
  showConsensus();
  const predictsRain=(r)=> (r.prob>=50 || (r.sum!=null && r.sum>=1.0));
  const rain=usable.filter(predictsRain).length, dry=usable.length-rain, n=usable.length;
  const majorityRain=rain>n/2;
  const agree=Math.max(rain,dry)/n;
  const sums=usable.map(r=>r.sum==null?0:r.sum);
  const mmMin=Math.min(...sums), mmMax=Math.max(...sums), spread=mmMax-mmMin;
  const sorted=[...sums].sort((a,b)=>a-b), mmMed=sorted[Math.floor(sorted.length/2)];
  let levelKey, cls;
  if(agree>=0.8 && spread<=3){ levelKey="high"; cls="high"; }
  else if(agree<0.6 || spread>8){ levelKey="low"; cls="low"; }
  else { levelKey="medium"; cls="medium"; }
  const badge=$("csBadge"); badge.className="cs-badge "+cls;
  badge.innerHTML=`${t("reliability")}<span class="lvl">${t(levelKey)}</span>`;
  $("csTitle").textContent = majorityRain
    ? t("models_rain",{n:rain,m:n})
    : t("models_dry",{n:dry,m:n});
  let sub;
  if(cls==="high"){
    sub = majorityRain ? t("agree_high_rain",{mm:formatMM(mmMed)}) : t("agree_high_dry");
  } else if(cls==="medium"){
    sub = t("agree_medium",{a:formatMM(mmMin), b:formatMM(mmMax)});
  } else {
    sub = t("agree_low",{a:formatMM(mmMin), b:formatMM(mmMax)});
  }
  $("csSub").textContent=sub;
  $("csModels").innerHTML=rows.map(r=>{
    const c=!r.usable?"na":(predictsRain(r)?"rain":"dry");
    const vals=r.usable?`${r.prob}% · ${formatMM(r.sum)}`:t("no_data");
    return `<span class="cs-m"><span class="dot ${c}"></span><span class="nm">${r.name}</span><span class="vals">${vals}</span></span>`;
  }).join("");
}

    CURRENT_DATA=d;
    renderCurrent(d); renderDays(d, 15); renderRainNow(d); renderHourly(d);
  }catch(e){ toast(t("weather_err")); $("nowDesc").textContent=t("err_load"); }
}

// Index helpers and per-date grouping (past_days shifts the arrays)
function buildIndex(d){
  const curPrefix = d.current.time.slice(0,13);   // YYYY-MM-DDTHH
  const curDate   = d.current.time.slice(0,10);
  let nowIdx = d.hourly.time.findIndex(x=>x.slice(0,13)===curPrefix);
  if(nowIdx<0) nowIdx = d.hourly.time.findIndex(x=>x.slice(0,10)===curDate);
  let todayIdx = d.daily.time.indexOf(curDate);
  if(todayIdx<0) todayIdx = Math.max(0, d.daily.time.length-16);
  const byDate={};
  d.hourly.time.forEach((x,i)=>{
    const day=x.slice(0,10), h=+x.slice(11,13);
    (byDate[day]=byDate[day]||[]).push({h, temp:d.hourly.temperature_2m[i],
      code:d.hourly.weather_code[i], prob:d.hourly.precipitation_probability[i]||0});
  });
  return { nowIdx, todayIdx, byDate, curDate };
}

function renderCurrent(d){
  const c=d.current, u=d.current_units||{};
  $("nowIco").innerHTML = iconSVG(c.weather_code, c.is_day!==0, 64);
  $("nowTemp").textContent = Math.round(c.temperature_2m)+"°";
  $("nowDesc").textContent = wmoText(c.weather_code);
  $("mFeels").textContent = Math.round(c.apparent_temperature)+"°";
  $("mWind").textContent = Math.round(c.wind_speed_10m)+" "+(u.wind_speed_10m||"km/h");
  $("mHum").textContent = Math.round(c.relative_humidity_2m)+"%";
  const t0=d._idx.todayIdx, dd=d.daily;
  $("nowMinMax").innerHTML = `<span class="mx">↑ <b>${Math.round(dd.temperature_2m_max[t0])}°</b></span>`
    + `<span class="mn">↓ <b>${Math.round(dd.temperature_2m_min[t0])}°</b></span>`;
}

// Morning / afternoon segment from the hourly entries of a day
function segment(entries, from, to, repHour){
  const sel = entries.filter(e=>e.h>=from && e.h<to);
  if(!sel.length) return null;
  let prob=0, rep=sel[0], bestSev=-1;
  sel.forEach(e=>{ if(e.prob>prob) prob=e.prob; const s=severity(e.code); if(s>bestSev){bestSev=s;rep=e;} });
  const repHourEntry = sel.find(e=>e.h===repHour);
  const temp = Math.round((repHourEntry||sel[Math.floor(sel.length/2)]).temp);
  return { code:rep.code, prob:Math.round(prob), temp };
}
function fallbackSeg(dd,i){ return { code:dd.weather_code[i], prob:dd.precipitation_probability_max[i]||0, temp:Math.round(dd.temperature_2m_max[i]) }; }
function segHTML(label, s){
  const prob = s.prob>0 ? `<div class="seg-prob">💧 ${s.prob}%</div>` : "";
  return `<div class="seg"><span class="seg-when">${label}</span><span class="seg-ico">${iconSVG(s.code,true,30)}</span><span class="seg-temp">${s.temp}°</span>${prob}</div>`;
}

/* ===================== Day carousel ===================== */
function renderDays(d, n){
  const dd=d.daily, idx=d._idx, box=$("days"); box.innerHTML="";
  const start=idx.todayIdx, end=Math.min(dd.time.length, start+n);
  for(let i=start;i<end;i++){
    const iso=dd.time[i], entries=idx.byDate[iso]||[];
    const isToday=(iso===idx.curDate);
    const morning = segment(entries, 6, 14, 9)  || fallbackSeg(dd,i);
    const afternoon = segment(entries, 14, 21, 16) || fallbackSeg(dd,i);
    const card=document.createElement("div"); card.className="day-card"+(isToday?" today":"");
    card.dataset.date=iso;
    card.addEventListener("click", ()=>openDayModal(iso));
    card.innerHTML =
      `<div class="dc-head"><span class="dc-name">${dayLabel(iso,isToday, i===start+1)}</span><span class="dc-date">${shortDate(iso)}</span></div>`+
      segHTML(t("morning"), morning)+
      segHTML(t("afternoon"), afternoon)+
      `<div class="dc-foot"><span>${t("min_l")} <b>${Math.round(dd.temperature_2m_min[i])}°</b></span><span>${t("max_l")} <b>${Math.round(dd.temperature_2m_max[i])}°</b></span></div>`;
    box.appendChild(card);
  }
  updateCarouselUI();
}
function updateCarouselUI(){
  const c=$("days"), fade=$("fadeRight");
  const scrollable = c.scrollWidth > c.clientWidth + 4;
  c.style.justifyContent = scrollable ? "flex-start" : "center";
  const atEnd = c.scrollLeft + c.clientWidth >= c.scrollWidth - 6;
  fade.classList.toggle("show", scrollable && !atEnd);
}
$("days").addEventListener("scroll", updateCarouselUI);

/* ===================== Day detail popup (navigable) ===================== */
let dayModalOpen=false, dmIndex=0, dmMin=0, dmMax=0;
function openDayModal(iso){
  const d=CURRENT_DATA; if(!d) return;
  const dd=d.daily, idx=d._idx;
  dmMin=idx.todayIdx; dmMax=Math.min(dd.time.length-1, idx.todayIdx+14);
  let di=dd.time.indexOf(iso); if(di<0) di=dmMin;
  dmIndex=Math.max(dmMin, Math.min(dmMax, di));
  $("dayModal").classList.remove("hidden"); dayModalOpen=true;
  renderDayModal(0);
  try{ history.pushState({dm:1}, ""); }catch(e){}
}
function renderDayModal(dir){
  const d=CURRENT_DATA; if(!d) return;
  const dd=d.daily, idx=d._idx, di=dmIndex, iso=dd.time[di];
  const label=(iso===idx.curDate)?t("today"):weekdayName(new Date(iso+"T00:00"));
  $("dmTitle").textContent=label;
  $("dmIco").innerHTML=iconSVG(dd.weather_code[di], true, 46);

    const prob=h.precipitation_probability[i]||0, mm=h.precipitation[i]||0, isNow=(i===idx.nowIdx);
    const sens=Math.round(h.apparent_temperature[i]), wind=Math.round(h.wind_speed_10m[i]), hum=Math.round(h.relative_humidity_2m[i]), wdir=windDir(h.wind_direction_10m[i]);
    rows+=`<div class="dm-row${isNow?" now":""}">`
      +`<div class="dm-main">`
        +`<span class="dm-time">${String(hr).padStart(2,"0")}:00${isNow?" ·":""}</span>`
        +`<span class="dm-ico2">${iconSVG(h.weather_code[i], isDay, 26)}</span>`
        +`<span class="dm-temp">${Math.round(h.temperature_2m[i])}°</span>`

      +`</div>`
      +`<div class="dm-meta"><span>${META_ICONS.temp} ${t("feels_short")} ${sens}°</span><span>${META_ICONS.wind} ${wind} km/h${wdir?" "+wdir:""}</span><span>${META_ICONS.hum} ${hum}%</span></div>`
      +`</div>`;
  }

  if(dir){ body.style.animation="none"; requestAnimationFrame(()=>{ body.style.animation=`dmSlide${dir>0?"L":"R"} .22s ease`; }); }
}
function goDay(delta){ const ni=Math.max(dmMin, Math.min(dmMax, dmIndex+delta)); if(ni!==dmIndex){ dmIndex=ni; renderDayModal(delta); } }
function closeDayModal(fromPop){
  if(!dayModalOpen) return;
  $("dayModal").classList.add("hidden");
  dayModalOpen=false;
  if(!fromPop){ try{ if(history.state && history.state.dm) history.back(); }catch(e){} }
}
$("dmClose").addEventListener("click", ()=>closeDayModal(false));
$("dmPrev").addEventListener("click", ()=>goDay(-1));
$("dmNext").addEventListener("click", ()=>goDay(1));
$("dayModal").addEventListener("click", (e)=>{ if(e.target===$("dayModal")) closeDayModal(false); });
window.addEventListener("keydown", (e)=>{
  if(!dayModalOpen) return;
  if(e.key==="Escape") closeDayModal(false);
  else if(e.key==="ArrowLeft") goDay(-1);
  else if(e.key==="ArrowRight") goDay(1);
});
window.addEventListener("popstate", ()=>{ if(dayModalOpen) closeDayModal(true); });
(function daySwipe(){
  let x0=null,y0=null;
  const card=$("dmCard");
  card.addEventListener("touchstart",(e)=>{ const p=e.touches[0]; x0=p.clientX; y0=p.clientY; },{passive:true});
  card.addEventListener("touchend",(e)=>{
    if(x0==null) return; const p=e.changedTouches[0], dx=p.clientX-x0, dy=p.clientY-y0;

/* ===================== Chance of rain (gauge) ===================== */
function renderRainNow(d){
  const idx=d._idx, hp=d.hourly.precipitation_probability;
  let nowProb=0;
  if(idx.nowIdx>=0){ const win=hp.slice(idx.nowIdx, idx.nowIdx+6).filter(v=>v!=null); if(win.length) nowProb=Math.max(...win); }
  if(!nowProb){ nowProb=d.daily.precipitation_probability_max[idx.todayIdx]||0; }
  const arc=$("gaugeArc"), C=251.2;
  arc.style.strokeDashoffset = C - (C*nowProb/100);
  arc.style.stroke = nowProb>=60 ? "var(--accent)" : nowProb>=30 ? "var(--prob)" : "var(--rain)";
  $("gaugeVal").textContent = Math.round(nowProb)+"%";
  const rainingNow = (d.current && d.current.precipitation>0);
  let big, sub;
  if(rainingNow){ big="🌧️ "+t("raining_now"); sub=t("raining_now_sub",{mm:d.current.precipitation}); }
  else if(nowProb>=60){ big=t("very_likely"); sub=t("very_likely_sub"); }
  else if(nowProb>=30){ big=t("possible"); sub=t("possible_sub"); }
  else if(nowProb>0){ big=t("unlikely"); sub=t("unlikely_sub"); }
  else { big="☀️ "+t("none"); sub=t("none_sub"); }
  $("rainBig").textContent=big; $("rainSub").textContent=sub;
  const total=d.daily.precipitation_sum[idx.todayIdx]||0;
  $("rainHint").textContent = total>0 ? t("today_accum",{mm:total.toFixed(1)}) : "";
}

/* ===================== Precipitation chart (±12h) ===================== */
function renderPrecipChart(d){
  const cv=$("precipChart"), empty=$("chartEmpty"), scroll=$("chartScroll"), idx=d._idx;
  if(idx.nowIdx<0 || !d.hourly.time.length){ cv.style.display="none"; empty.style.display="block"; empty.textContent=t("precip_no_data"); return; }
  cv.style.display="block"; empty.style.display="none";
  const start=Math.max(0, idx.nowIdx-12), end=Math.min(d.hourly.time.length-1, idx.nowIdx+12);
  const times=[], precip=[], prob=[], past=[];
  for(let i=start;i<=end;i++){
    times.push(d.hourly.time[i]);
    precip.push(d.hourly.precipitation[i]||0);
    prob.push(d.hourly.precipitation_probability[i]||0);
    past.push(i<idx.nowIdx);
  }
  const nowPos = idx.nowIdx - start;
  const N=times.length, hourW=54, padT=14, padB=34;
  const H=196, plotH=H-padT-padB;
  const cssW=N*hourW;
  const dpr=window.devicePixelRatio||1;
  cv.style.width=cssW+"px"; cv.style.height=H+"px"; cv.width=cssW*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,H);
  const font=getVar("--font");
  const cRain=getVar("--rain"), cPast=getVar("--rainpast"), cProb=getVar("--prob"),
        cLine=getVar("--line"), cMuted=getVar("--muted"), cAccent=getVar("--accent");
  const maxP=niceMax(Math.max(0.5, Math.max(...precip)*1.2));

  ctx.strokeStyle=cLine; ctx.lineWidth=1;
  for(let g=0;g<=4;g++){ const y=padT+plotH*g/4; ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cssW,y); ctx.stroke(); }
  ctx.globalAlpha=1;
  ctx.fillStyle=cLine; ctx.globalAlpha=.18; ctx.fillRect(0,padT, nowPos*hourW, plotH); ctx.globalAlpha=1;

  const barW=hourW*0.56;
  precip.forEach((v,i)=>{
    const x=i*hourW+(hourW-barW)/2, bh=(v/maxP)*plotH;
    ctx.fillStyle = past[i]?cPast:cRain; ctx.globalAlpha=v>0?0.95:0.12;
    const h=Math.max(bh, v>0?2:1); roundRect(ctx, x, padT+plotH-h, barW, h, 4); ctx.fill();
  });
  ctx.globalAlpha=1;

  const px=(i)=>i*hourW+hourW/2, py=(p)=>padT+plotH*(1-p/100);
  ctx.fillStyle=cProb; ctx.globalAlpha=.13;
  ctx.beginPath(); ctx.moveTo(px(0),padT+plotH);
  for(let i=0;i<N;i++){ ctx.lineTo(px(i),py(prob[i])); }
  ctx.lineTo(px(N-1),padT+plotH); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1; ctx.lineWidth=2.5; ctx.strokeStyle=cProb;
  ctx.globalAlpha=.45; ctx.beginPath();
  for(let i=0;i<=nowPos;i++){ i===0?ctx.moveTo(px(i),py(prob[i])):ctx.lineTo(px(i),py(prob[i])); } ctx.stroke();
  ctx.globalAlpha=1; ctx.beginPath();
  for(let i=nowPos;i<N;i++){ i===nowPos?ctx.moveTo(px(i),py(prob[i])):ctx.lineTo(px(i),py(prob[i])); } ctx.stroke();
  prob.forEach((p,i)=>{ ctx.fillStyle=cProb; ctx.globalAlpha=past[i]?.5:1; ctx.beginPath(); ctx.arc(px(i),py(p),3,0,7); ctx.fill(); });
  ctx.globalAlpha=1;

  const nx=nowPos*hourW+hourW/2;
  ctx.strokeStyle=cAccent; ctx.lineWidth=2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(nx,padT-4); ctx.lineTo(nx,padT+plotH); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=cAccent; ctx.font="600 11px "+font; ctx.textAlign="center";
  ctx.fillText(t("now"), nx, padT-6);

  ctx.fillStyle=cMuted; ctx.font="10px "+font; ctx.textAlign="center";
  times.forEach((x,i)=>{ ctx.fillText(x.slice(11,13)+"h", i*hourW+hourW/2, H-14); });

  const yl=$("yLeft"), yr=$("yRight"); yl.innerHTML=""; yr.innerHTML="";
  for(let g=0;g<=4;g++){
    const y=padT+plotH*g/4-6, mm=maxP*(1-g/4), pc=Math.round(100*(1-g/4));
    const l=document.createElement("span"); l.style.top=y+"px"; l.textContent=axisFmt(Math.round(mm*100)/100); yl.appendChild(l);
    const rr=document.createElement("span"); rr.style.top=y+"px"; rr.textContent=pc+"%"; yr.appendChild(rr);
  }
  requestAnimationFrame(()=>{ scroll.scrollLeft = Math.max(0, nx - scroll.clientWidth/2); });
}
function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); if(r<0)r=0;
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
window.addEventListener("resize", ()=>{ if(CURRENT_DATA){ activateHourlyTab(HOURLY_TAB); updateCarouselUI(); } });

/* ===================== Hourly tabs ===================== */
let HOURLY_TAB="temp";
function buildWindow(d){
  const idx=d._idx, h=d.hourly;
  if(!h||!h.time||idx.nowIdx<0) return null;
  const start=Math.max(0, idx.nowIdx-12), end=Math.min(h.time.length-1, idx.nowIdx+12);
  const times=[], past=[];
  for(let i=start;i<=end;i++){ times.push(h.time[i]); past.push(i<idx.nowIdx); }
  return {start,end,nowPos:idx.nowIdx-start,times,past, val:(k)=>{const a=[];for(let i=start;i<=end;i++)a.push(h[k]?h[k][i]:null);return a;}};
}
function renderHourly(d){ renderTempChart(d); renderPrecipChart(d); renderWindChart(d); setDefaultHourlyTab(d); }
function activateHourlyTab(tab){
  HOURLY_TAB=tab;
  document.querySelectorAll("#hourlyTabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  [["temp","panelTemp"],["precip","panelPrecip"],["wind","panelWind"]].forEach(([tb,id])=>$(id).classList.toggle("active", tb===tab));
  if(!CURRENT_DATA) return;
  if(tab==="temp") renderTempChart(CURRENT_DATA);
  else if(tab==="precip") renderPrecipChart(CURRENT_DATA);
  else renderWindChart(CURRENT_DATA);
}
$("hourlyTabs").addEventListener("click",(e)=>{ if(e.target.tagName==="BUTTON") activateHourlyTab(e.target.dataset.tab); });

function setDefaultHourlyTab(d){
  const idx=d._idx, h=d.hourly, t0=idx.todayIdx;
  let maxWind=0, maxGust=0, precipSoon=false;
  const e=Math.min(h.time.length-1, idx.nowIdx+12);
  for(let i=Math.max(0,idx.nowIdx);i<=e;i++){
    maxWind=Math.max(maxWind, h.wind_speed_10m[i]||0);
    if(h.wind_gusts_10m) maxGust=Math.max(maxGust, h.wind_gusts_10m[i]||0);
    if((h.precipitation_probability[i]||0)>=50 || (h.precipitation[i]||0)>=0.5) precipSoon=true;
  }
  const precipToday=(d.daily.precipitation_sum[t0]||0)>=1 || (d.daily.precipitation_probability_max[t0]||0)>=50;
  let tab="temp";
  if(precipSoon || precipToday) tab="precip";
  else if(maxWind>=40 || maxGust>=55) tab="wind";
  activateHourlyTab(tab);
}

function renderTempChart(d){
  const w=buildWindow(d); if(!w) return;
  const temp=w.val("temperature_2m"), hum=w.val("relative_humidity_2m").map(v=>v==null?0:v);
  const tv=temp.filter(v=>v!=null); const tmin=Math.min(...tv), tmax=Math.max(...tv);
  let lo=Math.floor(tmin)-1, hi=Math.ceil(tmax)+1; const sp=hi-lo; hi+=(4-(sp%4))%4;   // multiple of 4 for whole-number ticks
  drawSeriesChart($("chartTemp"),$("scrollTemp"),$("yLeftTemp"),$("yRightTemp"),{
    times:w.times,past:w.past,nowPos:w.nowPos,
    primary:{data:temp,color:getVar("--warn"),min:lo,max:hi,fill:true,unit:"°",showValues:true},
    secondary:{data:hum,color:getVar("--rain"),min:0,max:100,axis:"right",unit:"%"}
  });
}
function renderWindChart(d){
  const w=buildWindow(d); if(!w) return;
  const wind=w.val("wind_speed_10m").map(v=>v==null?0:v);
  const hasGust=!!d.hourly.wind_gusts_10m;
  const gust=hasGust? w.val("wind_gusts_10m").map(v=>v==null?0:v):null;
  const dir=w.val("wind_direction_10m");
  const maxv=Math.max(8, ...(gust||wind)); const top=niceMax(maxv);
  drawSeriesChart($("chartWind"),$("scrollWind"),$("yLeftWind"),null,{
    times:w.times,past:w.past,nowPos:w.nowPos,
    primary:{data:wind,color:getVar("--accent2"),min:0,max:top,fill:true,unit:"",showValues:true},
    secondary: gust?{data:gust,color:getVar("--muted"),min:0,max:top,axis:"left"}:null,
    sub:(i)=>windDir(dir[i])
  });
}
function drawSeriesChart(cv, scroll, yL, yR, cfg){
  const {times,past,nowPos,primary:p,secondary:s,sub}=cfg;
  const N=times.length, hourW=54, padT=14, padB=sub?46:34, H=sub?208:196, plotH=H-padT-padB;
  const dpr=window.devicePixelRatio||1, cssW=N*hourW;
  cv.style.width=cssW+"px"; cv.style.height=H+"px"; cv.width=cssW*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,H);
  const font=getVar("--font"), cLine=getVar("--line"), cMuted=getVar("--muted"), cAccent=getVar("--accent"), cInk=getVar("--ink");
  ctx.strokeStyle=cLine; ctx.lineWidth=1;
  for(let g=0;g<=4;g++){const y=padT+plotH*g/4; ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cssW,y); ctx.stroke();}
  ctx.globalAlpha=1;
  ctx.fillStyle=cLine; ctx.globalAlpha=.18; ctx.fillRect(0,padT,nowPos*hourW,plotH); ctx.globalAlpha=1;
  const px=(i)=>i*hourW+hourW/2, mapY=(v,mn,mx)=>padT+plotH*(1-(v-mn)/((mx-mn)||1));
  const yP=(v)=>mapY(v,p.min,p.max);
  if(p.fill){
    ctx.fillStyle=p.color; ctx.globalAlpha=.14; ctx.beginPath(); let started=false;
    for(let i=0;i<N;i++){ if(p.data[i]==null) continue; const x=px(i),y=yP(p.data[i]); if(!started){ctx.moveTo(x,padT+plotH);ctx.lineTo(x,y);started=true;} else ctx.lineTo(x,y); }
    ctx.lineTo(px(N-1),padT+plotH); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  }
  drawLine(ctx,p.data,px,yP,p.color,past,nowPos);
  if(s){ const yS=(v)=>mapY(v,s.min,s.max); drawLine(ctx,s.data,px,yS,s.color,past,nowPos); }
  if(p.showValues){ ctx.fillStyle=cInk; ctx.font="600 10px "+font; ctx.textAlign="center";
    for(let i=0;i<N;i+=3){ if(p.data[i]==null) continue; ctx.fillText(Math.round(p.data[i])+(p.unit||""), px(i), yP(p.data[i])-8); } }
  const nx=px(nowPos); ctx.strokeStyle=cAccent; ctx.lineWidth=2; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(nx,padT-4); ctx.lineTo(nx,padT+plotH); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=cAccent; ctx.font="600 11px "+font; ctx.textAlign="center"; ctx.fillText(t("now"),nx,padT-6);
  ctx.fillStyle=cMuted; ctx.font="10px "+font; ctx.textAlign="center";
  times.forEach((x,i)=>{ ctx.fillText(x.slice(11,13)+"h", px(i), H-(sub?28:14)); if(sub){ const sv=sub(i); if(sv) ctx.fillText(sv, px(i), H-12); } });
  fillAxis(yL, p.min, p.max, p.unit||"");
  if(yR){ if(s && s.axis==="right") fillAxis(yR, s.min, s.max, s.unit||""); else yR.innerHTML=""; }
  requestAnimationFrame(()=>{ scroll.scrollLeft=Math.max(0, nx - scroll.clientWidth/2); });
}
function drawLine(ctx,data,px,yF,color,past,nowPos){
  ctx.lineWidth=2.5; ctx.strokeStyle=color;
  ctx.globalAlpha=.45; ctx.beginPath(); let started=false;
  for(let i=0;i<=nowPos;i++){ if(data[i]==null) continue; const x=px(i),y=yF(data[i]); started?ctx.lineTo(x,y):(ctx.moveTo(x,y),started=true); } ctx.stroke();
  ctx.globalAlpha=1; ctx.beginPath(); started=false;
  for(let i=nowPos;i<data.length;i++){ if(data[i]==null) continue; const x=px(i),y=yF(data[i]); started?ctx.lineTo(x,y):(ctx.moveTo(x,y),started=true); } ctx.stroke();
  data.forEach((v,i)=>{ if(v==null) return; ctx.fillStyle=color; ctx.globalAlpha=past[i]?.5:1; ctx.beginPath(); ctx.arc(px(i),yF(v),2.6,0,7); ctx.fill(); }); ctx.globalAlpha=1;
}
function fillAxis(el,min,max,unit){
  if(!el) return; el.innerHTML="";
  const padT=14, plotH=148;
  for(let g=0;g<=4;g++){ const y=padT+plotH*g/4-6, v=max-(max-min)*g/4;
    const sp=document.createElement("span"); sp.style.top=y+"px"; sp.textContent=Math.round(v)+unit; el.appendChild(sp); }
}

/* ===================== Radar and layers ===================== */
let radarState = { frames:[], idx:0, layers:{}, playing:true, timer:null, host:"" };
function initOrMoveRadar(){
  const zoom=10;
  if(!STATE.map){
    STATE.map = L.map("radar", { zoomControl:true, attributionControl:false }).setView([STATE.lat,STATE.lon], zoom);
    const mapLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png",
      {maxZoom:20, subdomains:"abcd"});
    const satLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:19});
    mapLayer.addTo(STATE.map);
    STATE.radarLayerGroup = L.layerGroup().addTo(STATE.map);
    // Labels above the radar so place names stay visible over the precipitation
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
      {maxZoom:20, subdomains:"abcd", zIndex:650}).addTo(STATE.map);
    L.control.attribution({prefix:false}).addAttribution('© OpenStreetMap, © CARTO, © Esri').addTo(STATE.map);
    const layers={}; layers[t("layer_map")]=mapLayer; layers[t("layer_sat")]=satLayer;
    L.control.layers(layers, null, {position:"topright"}).addTo(STATE.map);
    STATE.marker = L.circleMarker([STATE.lat,STATE.lon], {radius:7,color:"#fff",weight:2,fillColor:"#4f9dff",fillOpacity:1}).addTo(STATE.map);
    loadRadarFrames();
    $("radarPlay").addEventListener("click", toggleRadarPlay);
    setTimeout(()=>STATE.map.invalidateSize(), 200);
  } else {
    STATE.map.setView([STATE.lat,STATE.lon], zoom);
    STATE.marker.setLatLng([STATE.lat,STATE.lon]);
  }
}
async function loadRadarFrames(){
  try{
    const r=await fetch("https://api.rainviewer.com/public/weather-maps.json"); const d=await r.json();
    radarState.host=d.host;
    const p=(d.radar&&d.radar.past)||[], n=(d.radar&&d.radar.nowcast)||[];
    radarState.frames=[...p, ...n];
    if(!radarState.frames.length){ $("radarTime").textContent=t("radar_unavailable"); return; }
    radarState.idx=Math.max(0, p.length-1); showRadarFrame(radarState.idx); startRadarLoop();
  }catch(e){ $("radarTime").textContent=t("radar_unavailable"); }
}
function frameLayer(frame){
  if(radarState.layers[frame.time]) return radarState.layers[frame.time];
  const url=`${radarState.host}${frame.path}/256/{z}/{x}/{y}/4/1_1.png`;
  const layer=L.tileLayer(url, {opacity:0, tileSize:256, zIndex:400, maxNativeZoom:7, maxZoom:20});
  STATE.radarLayerGroup.addLayer(layer);
  radarState.layers[frame.time]=layer; return layer;
}
function showRadarFrame(i){
  const f=radarState.frames[i]; if(!f) return;
  Object.values(radarState.layers).forEach(l=>l.setOpacity(0));
  frameLayer(f).setOpacity(0.55);
  const dt=new Date(f.time*1000), hh=String(dt.getHours()).padStart(2,"0"), mm=String(dt.getMinutes()).padStart(2,"0");
  const isPast=f.time*1000<=Date.now();
  $("radarTime").textContent=(isPast?"":t("forecast_prefix"))+`${hh}:${mm}`;
}
function startRadarLoop(){ clearInterval(radarState.timer);
  radarState.timer=setInterval(()=>{ if(!radarState.playing) return;
    radarState.idx=(radarState.idx+1)%radarState.frames.length; showRadarFrame(radarState.idx); }, 700); }
function toggleRadarPlay(){ radarState.playing=!radarState.playing; $("radarPlay").textContent=radarState.playing?"⏸️":"▶️"; }

/* ===================== Startup ===================== */
applyI18n();
(function boot(){
  let last=null; try{ last=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if("permissions" in navigator && navigator.permissions.query){
    navigator.permissions.query({name:"geolocation"}).then(p=>{
      if(p.state==="granted") requestPreciseSilently(last);
      else if(last){ setLocation(last.lat,last.lon,last.name); }
      else { showOverlay(""); requestPreciseLocation(); }
    }).catch(()=>fallbackBoot(last));
  } else fallbackBoot(last);
})();
function fallbackBoot(last){ if(last) setLocation(last.lat,last.lon,last.name); else { showOverlay(""); requestPreciseLocation(); } }
function requestPreciseSilently(last){
  if(!("geolocation" in navigator)){ if(last) setLocation(last.lat,last.lon,last.name); else showOverlay(""); return; }
  $("locName").textContent=t("detecting");
  navigator.geolocation.getCurrentPosition(
    async (pos)=>{ const name=await reverseGeocode(pos.coords.latitude,pos.coords.longitude); setLocation(pos.coords.latitude,pos.coords.longitude,name||t("my_location")); },
    ()=>{ if(last) setLocation(last.lat,last.lon,last.name); else showOverlay(t("geo_fail"), true); },
    { enableHighAccuracy:true, timeout:12000, maximumAge:600000 }
  );
}
</script>
